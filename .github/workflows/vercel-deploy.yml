# CineVibe - Auto Deploy to Vercel
#
# OPTIONAL: This workflow automatically deploys to Vercel on push to main.
# To enable it, add these secrets in your GitHub repo (Settings > Secrets):
#   - VERCEL_TOKEN:        https://vercel.com/account/tokens
#   - VERCEL_ORG_ID:       https://vercel.com/account/settings
#   - VERCEL_PROJECT_ID:   found in .vercel/project.json after linking
#
# If you prefer, you can skip this workflow and deploy manually:
#   vercel.com -> Import Project -> select Vave-TechStack/cinevibe -> Deploy

name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
